<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <style>
    .frame { image-rendering: pixelated; animation: c1-idle 5s steps(6, end) infinite; }
    @keyframes c1-idle { to { transform: translate(-384px, 0); } }
  </style>
  <clipPath id="c1-clip"><rect width="64" height="64"/></clipPath>
  <g clip-path="url(#c1-clip)">
    <image class="frame" image-rendering="pixelated" width="1536" height="64" href="data:image/png;base64,"/>
  </g>
</svg>
